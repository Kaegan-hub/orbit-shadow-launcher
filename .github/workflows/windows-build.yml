name: Build Orbit Shadow for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - codex/launcher-visual-refresh

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Select stable Rust
        run: rustup default stable
      - name: Install launcher tools
        run: npm ci
      - name: Verify launcher interactions
        run: npm test
      - name: Build launcher and Windows installer
        run: npm run tauri -- build -- --locked
      - name: Save Windows builds
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Orbit-Shadow-Windows
          path: |
            src-tauri/target/release/orbit-shadow-launcher.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
