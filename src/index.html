<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Orbit Shadow — Launcher</title>
  <link rel="icon" type="image/svg+xml" href="assets/orbit-mark.svg">
  <link rel="stylesheet" href="styles.css">
  <script src="main.js" defer></script>
</head>
<body>
  <!-- Real local splash screen shown ONLY while the launcher checks for/
       downloads/installs an update on startup (see src-tauri/src/lib.rs's
       setup()) -- the real "PLAY" experience this used to show is gone,
       since the main window now navigates to the live orbit-shadow.cloud
       site itself right after this resolves (see LAUNCHER_HOME_URL_BASE).
       Real gap this replaces: with no update available, that navigation
       already happened here in under a second, so most users never see
       this at all; when an update IS being downloaded/installed, this is
       what finally gives that step visible feedback instead of the app
       just looking like it silently closed and reopened. -->
  <main class="launcher" aria-label="Orbit Shadow launcher">
    <div class="scene" aria-hidden="true"></div>
    <div class="scene-shade" aria-hidden="true"></div>
    <div class="stars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true"><circle cx="20" cy="20" r="10.5" stroke="currentColor" stroke-width="1.6"/><ellipse cx="20" cy="20" rx="19" ry="7" transform="rotate(-40 20 20)" stroke="currentColor" stroke-width="1.2"/><circle cx="30.2" cy="8.8" r="2.8" fill="#e3faff"/><path d="M15 25a7 7 0 0 1 8-11" stroke="#e3faff" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span class="brand-name">ORBIT SHADOW</span>
      </div>
    </header>
    <section class="splash-body">
      <div class="splash-spinner" aria-hidden="true"></div>
      <p id="status-msg" class="splash-status" role="status" aria-live="polite">Starting Orbit Shadow…</p>
    </section>
  </main>
</body>
</html>
