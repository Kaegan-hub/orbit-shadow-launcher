<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Orbit Shadow — Launcher</title>
  <link rel="icon" type="image/svg+xml" href="assets/orbit-mark.svg">
  <link rel="stylesheet" href="styles.css">
  <script src="main.js" defer></script>
</head>
<body>
  <main class="launcher" aria-label="Orbit Shadow launcher">
    <div class="scene" aria-hidden="true"></div>
    <div class="scene-shade" aria-hidden="true"></div>
    <div class="stars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true"><circle cx="20" cy="20" r="10.5" stroke="currentColor" stroke-width="1.6"/><ellipse cx="20" cy="20" rx="19" ry="7" transform="rotate(-40 20 20)" stroke="currentColor" stroke-width="1.2"/><circle cx="30.2" cy="8.8" r="2.8" fill="#e3faff"/><path d="M15 25a7 7 0 0 1 8-11" stroke="#e3faff" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span class="brand-name">ORBIT SHADOW</span>
      </div>
      <a id="discord-link" class="discord-button" href="https://discord.gg/orbit-shadow" target="_blank" rel="noopener noreferrer" aria-label="Join the Orbit Shadow Discord — opens your browser">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.7 5.1a18.3 18.3 0 0 0-4.5-1.4l-.6 1.2a16.6 16.6 0 0 0-5.2 0l-.6-1.2a18.7 18.7 0 0 0-4.5 1.4C1.5 9.2.7 13.2 1.1 17.2a18 18 0 0 0 5.5 2.8l1.1-1.8-1.7-.8.4-.3a13 13 0 0 0 11.2 0l.4.3-1.7.8 1.1 1.8a18 18 0 0 0 5.5-2.8c.5-4.7-.8-8.7-3.2-12.1ZM8.4 14.8c-1.1 0-1.9-1-1.9-2.2s.8-2.2 1.9-2.2 1.9 1 1.9 2.2-.8 2.2-1.9 2.2Zm7.2 0c-1.1 0-1.9-1-1.9-2.2s.8-2.2 1.9-2.2 1.9 1 1.9 2.2-.8 2.2-1.9 2.2Z"/></svg>
        <span>Discord</span><span class="external-arrow" aria-hidden="true">↗</span>
      </a>
    </header>
    <section class="hero" aria-labelledby="launcher-title">
      <p class="eyebrow"><span class="rule" aria-hidden="true"></span>BEYOND THE HORIZON</p>
      <h1 id="launcher-title"><span>ORBIT</span><span class="title-shadow">SHADOW</span></h1>
      <p class="description">Your next adventure starts here.</p>
      <div class="launch-actions">
        <button id="play-btn" class="play-button" type="button" aria-describedby="launch-note">
          <svg class="play-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m8 5 11 7-11 7V5Z" fill="currentColor"/></svg>
          <span><strong>PLAY</strong><small>Launch Orbit Shadow</small></span>
          <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <p id="launch-note" class="launch-note"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="2" stroke="currentColor"/><path d="M2 6h12" stroke="currentColor"/></svg>The game opens in a separate window.</p>
      </div>
    </section>
    <aside class="orbit-caption" aria-hidden="true"><span class="caption-line"></span><p>A NEW ORBIT.</p></aside>
    <footer class="bottom-bar">
      <div class="footer-brand"><span class="status-dot" aria-hidden="true"></span><span>ORBIT SHADOW</span><span class="version">v0.1.0</span></div>
      <button id="motion-toggle" class="motion-toggle" type="button" aria-pressed="true" aria-label="Visual animations">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 10h2l2-5 4 10 2-5h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Animations on</span>
      </button>
    </footer>
    <div id="status-msg" class="notice" role="status" aria-live="polite" hidden></div>
    <dialog id="preview-dialog" class="preview-dialog" aria-labelledby="preview-title" aria-describedby="preview-description">
      <form method="dialog">
        <p class="dialog-eyebrow">ORBIT SHADOW · PREVIEW</p>
        <h2 id="preview-title">Ready for takeoff.</h2>
        <p id="preview-description">You’re exploring the launcher preview. Open the installed Orbit Shadow app to start the game.</p>
        <button autofocus>Back to launcher <span aria-hidden="true">↗</span></button>
      </form>
    </dialog>
  </main>
</body>
</html>
