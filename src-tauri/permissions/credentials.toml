[[permission]]
identifier = "allow-save-login"
description = "Allows saving a username+password pair to the OS credential store for autofill."
commands.allow = ["save_login"]

[[permission]]
identifier = "allow-get-saved-password"
description = "Allows retrieving a previously saved password for a given username."
commands.allow = ["get_saved_password"]

[[permission]]
identifier = "allow-list-saved-usernames"
description = "Allows listing usernames that have a saved password."
commands.allow = ["list_saved_usernames"]

[[permission]]
identifier = "allow-forget-login"
description = "Allows deleting a previously saved username+password pair."
commands.allow = ["forget_login"]
